# GENERATED for sign/sign@1.0.0 — and yours to keep: the harness never overwrites
# this file, so a crate your answer depends on stays named here.
[package]
name = "fherma-solution"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fherma-solution"
path = "src/main.rs"

[dependencies]
poulpy-ckks = { version = "=0.8.3", features = ["test-utils"] }
poulpy-core = "=0.8.3"
poulpy-hal = "=0.8.3"
poulpy-cpu-ref = "=0.8.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_arch = "x86_64")'.dependencies]
poulpy-cpu-avx = { version = "=0.8.3", features = ["enable-avx", "enable-ckks"] }

[target.'cfg(target_arch = "aarch64")'.dependencies]
poulpy-cpu-arm = { version = "=0.8.3", features = ["enable-neon", "enable-ckks"] }

[profile.release]
opt-level = 3
